[project]
name = "rag-core"
version = "0.1.0"
description = "财税 RAG 平台共享核心：配置、schema、检索、模型客户端"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
