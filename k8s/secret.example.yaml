# 密钥模板。请复制为 secret.yaml 填入真实值后再 apply；secret.yaml 已被 .gitignore。
# 生产建议用 Sealed Secrets / External Secrets / 云 KMS，而非明文 Secret。
apiVersion: v1
kind: Secret
metadata:
  name: finance-rag-secret
  namespace: finance-rag
type: Opaque
stringData:
  # PostgreSQL：超级用户密码可自定义；应用角色 finance_rag_app 的密码由 M1 迁移写死为
  # finance_rag_app_dev（DATABASE_URL 必须与之一致）。生产加固：改迁移用可配置密码，
  # 或部署后 ALTER ROLE finance_rag_app PASSWORD ... 并同步 DATABASE_URL。
  POSTGRES_PASSWORD: "CHANGE_ME_pg_super"
  DATABASE_URL: "postgresql+asyncpg://finance_rag_app:finance_rag_app_dev@postgres:5432/finance_rag"
  DATABASE_ADMIN_URL: "postgresql+asyncpg://finance_rag:CHANGE_ME_pg_super@postgres:5432/finance_rag"
  # MinIO
  MINIO_ROOT_USER: "CHANGE_ME_minio_user"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_minio_pass"
  MINIO_ACCESS_KEY: "CHANGE_ME_minio_user"
  MINIO_SECRET_KEY: "CHANGE_ME_minio_pass"
  # 认证
  JWT_SECRET: "CHANGE_ME_long_random_secret"
  # 模型 API Key
  SILICONFLOW_API_KEY: "sk-CHANGE_ME"
  DEEPSEEK_API_KEY: "sk-CHANGE_ME"
