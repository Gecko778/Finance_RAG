[tool.uv.workspace]
members = ["apps/*", "packages/*"]
exclude = ["apps/web"]  # Node 前端，非 Python 成员

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# alembic 自动生成的迁移文件不做行宽约束
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 惯用法：参数默认值调用这些工厂函数是官方写法，非 bug
extend-immutable-calls = ["fastapi.Form", "fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "packages", "integrations"]
