# SPA 托管 + 反代后端 API（生产部署用；后端服务名/端口按部署环境调整）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由回退（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代（后端地址由部署环境注入，此处为 compose/K8s 内的服务名占位）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE（/chat 流式）需关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
