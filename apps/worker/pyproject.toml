[project]
name = "rag-worker"
version = "0.1.0"
description = "财税 RAG 平台摄取 worker"
requires-python = ">=3.11"
dependencies = [
    "arq>=0.26",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "rag-core",
]

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_worker"]
