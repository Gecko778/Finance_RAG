[project]
name = "rag-worker"
version = "0.1.0"
description = "财税 RAG 平台摄取 worker（arq 于 M2 引入）"
requires-python = ">=3.11"
dependencies = [
    "rag-core",
]

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_worker"]
